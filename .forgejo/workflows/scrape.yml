name: Scrape latest data

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '6 */2 * * *'

jobs:
  scrape:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Fetch and build
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: nix shell nixpkgs#sqlite-utils nixpkgs#jq nixpkgs#findutils --command ./run.sh

      - name: Publish database
        # Rename rather than write in place: Datasette holds the database open,
        # and install(1) truncates, so a reader can see a torn file mid-write.
        run: |-
          install -Dm644 music.db /var/lib/datasette-sites/lastfm/.music.db.new
          mv -f /var/lib/datasette-sites/lastfm/.music.db.new /var/lib/datasette-sites/lastfm/music.db
