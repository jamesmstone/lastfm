name: Scrape latest data

# Retired once hermanii runs services.lastfm-scraper (nix/scraper-module.nix):
# the timer does the same work with bounded git calls and without depending on
# the runner being on the host that serves the database. Kept until then so the
# scrape does not stop between this landing and that being switched on.

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '6 */2 * * *'

jobs:
  scrape:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Fetch the latest plays
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: nix run . -- fetch

      - name: Commit the raw data
        # A day with no new plays is the normal case, not a reason to stop: the
        # database is rebuilt and published either way.
        run: |-
          git config user.name "Automated"
          git config user.email "lastfmauto@jamesst.one"
          git add -A
          if git commit -m "Latest data: $(date -u)"; then
            git push origin HEAD:main
          else
            echo "no new data to commit" >&2
          fi

      - name: Build the database
        run: nix run . -- build

      - name: Publish database
        # Rename rather than write in place: Datasette holds the database open,
        # and install(1) truncates, so a reader can see a torn file mid-write.
        run: |-
          install -Dm644 music.db /var/lib/datasette-sites/lastfm/.music.db.new
          mv -f /var/lib/datasette-sites/lastfm/.music.db.new /var/lib/datasette-sites/lastfm/music.db
