name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Builds the binary, runs the Go tests, gofmt-checks the sources, builds
      # music.db from the fixture, and drives the scraper unit in a VM.
      - name: Build and test
        run: nix flake check --print-build-logs
