name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and test
        run: nix flake check --print-build-logs

      - name: Rebuild the database from the committed data
        run: nix run . -- build

      - name: Check the database
        run: nix run nixpkgs#sqlite -- music.db .tables
