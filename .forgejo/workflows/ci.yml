name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: native
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Builds the binary, runs the Go tests, gofmt-checks the sources, builds
      # music.db from the committed days, and drives the scraper unit in a VM.
      - name: Build and test
        run: nix flake check --print-build-logs

      - name: Build the database from the committed data
        run: nix build .#musicdb --print-build-logs

      - name: Check the database
        run: nix run nixpkgs#sqlite -- result .tables
